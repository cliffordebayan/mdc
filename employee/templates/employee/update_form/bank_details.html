{% load i18n %}
<div class="oh-wrapper">
    <div class="oh-general__tab-target oh-profile-section mb-4 d-none" id="bank">
        <div class="oh-profile-section__card">

            {% if bank_account %}
            <div class="mb-3 p-3 border rounded d-flex align-items-center gap-3" style="background:var(--oh-color-bg-subtle, #f8f9fa);">
                <div>
                    <strong>{{ bank_account.bank_name }}</strong>
                    <div><small class="text-muted">{% trans "Account" %}: {{ bank_account.account_number|default:"—" }}</small></div>
                </div>
            </div>
            <hr class="mb-3">
            {% endif %}

            <h6 class="fw-bold mb-3">{% trans "Bank Account" %}</h6>
            <form method="post" action="" id="bankUpdateForm">
                <div id="bankMessage"></div>
                {% csrf_token %}
                <input type="hidden" name="form" value="bank">
                {{bank_form.as_p}}
                <hr class="mt-4 mb-3">
                <div class="w-100 d-flex justify-content-end">
                    <button type="submit" class="oh-btn oh-btn--secondary oh-btn--w-100-resp">
                        {% trans "Save" %}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
