{% load static %}

<style>

  @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

* {
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
}

.hr-error {
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 0.5rem;
}

.hr-error_container {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100vh;
    padding: 1.5rem;
    box-sizing: border-box;
}

.hr-404 {
    font-size: 4rem;
    line-height: 4.2rem;
    margin-bottom: 0;
}

.hr-error_msg {
    font-weight: bold;
    font-size: 1.25rem;
    color: #e54f38;
}

.hr-error_btn {
    background-color: hsl(8deg, 77%, 56%);
    border: 2px solid hsl(8deg, 77%, 56%);
    color: hsl(0deg, 0%, 100%);
    border-radius: 35px;
    padding: 0.5rem 2rem;
    text-decoration: none;
    margin-top: 1rem;
    gap: 0.8rem;
    display: inline-flex;
    transition: all 0.4s ease-in-out;
    align-items: center;
    font-size: 1rem;
}

.hr-error_btn:hover {
    color: hsl(0deg, 0%, 100%);
    background-color: hsl(8deg, 77%, 45%);
    border: 2px solid hsl(8deg, 77%, 45%);
}

@media (max-width: 768px) {
    .hr-404 {
        font-size: 3rem;
        line-height: 3.2rem;
    }
    .hr-error_msg {
        font-size: 1rem;
    }
}
</style>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% if white_label_company.icon %}{{white_label_company.icon.url}} {% else %}{% static 'favicons/favicon-32x32.png' %}{% endif %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% if white_label_company.icon %}{{white_label_company.icon.url}} {% else %}{% static 'favicons/favicon-16x16.png' %}{% endif %}">
</head>

<body>
    <section class="hr-error_container">
        <div class="hr-error">
            <div>
                <h1 class="hr-404">404</h1>
                <p class="hr-error_msg">Page not found!</p>
                <p>Oops! The page you are looking for could not be found.</p>
                <a href="/" class="hr-error_btn"><ion-icon name="arrow-back-outline"></ion-icon>Return to the main
                    page</a>
            </div>
        </div>
    </section>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>

</html>
